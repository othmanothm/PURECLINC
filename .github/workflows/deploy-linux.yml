name: Deploy PURECLINC to Linux Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  BACKEND_PORT: 9072
  FRONTEND_PORT: 9073
  EXTRA_OPEN_PORT: 9074

jobs:
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./client
        run: npm ci

      - name: Build frontend
        working-directory: ./client
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Create app directories
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            mkdir -p /home/${{ secrets.SERVER_USER }}/WebSites/PURECLINC/frontend
            mkdir -p /home/${{ secrets.SERVER_USER }}/WebSites/PURECLINC/backend
            mkdir -p /home/${{ secrets.SERVER_USER }}/WebSites/PURECLINC/logs
            mkdir -p /home/${{ secrets.SERVER_USER }}/WebSites/PURECLINC/backups

      - name: Deploy frontend files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: client/dist/*
          target: /home/${{ secrets.SERVER_USER }}/WebSites/PURECLINC/frontend
          strip_components: 2
          rm: true

      - name: Setup frontend systemd service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            APP_USER=${{ secrets.SERVER_USER }}
            APP_HOME=/home/${{ secrets.SERVER_USER }}/WebSites/PURECLINC
            FRONTEND_PORT=${{ env.FRONTEND_PORT }}
            EXTRA_OPEN_PORT=${{ env.EXTRA_OPEN_PORT }}

            if ! command -v serve >/dev/null 2>&1; then
              echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S -p '' npm install -g serve
            fi

            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S -p '' ufw allow ${FRONTEND_PORT}/tcp comment 'PURECLINC Frontend' 2>/dev/null || true
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S -p '' ufw allow ${EXTRA_OPEN_PORT}/tcp comment 'PURECLINC Extra' 2>/dev/null || true
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S -p '' systemctl unmask pureclinc-frontend.service 2>/dev/null || true
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S -p '' systemctl stop pureclinc-frontend.service 2>/dev/null || true
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S -p '' systemctl disable pureclinc-frontend.service 2>/dev/null || true

            SERVE_PATH=$(command -v serve || echo /usr/bin/serve)
            cat > /tmp/pureclinc-frontend.service << EOFSERVICE
            [Unit]
            Description=PURECLINC Frontend Service
            After=network.target

            [Service]
            Type=simple
            User=${APP_USER}
            WorkingDirectory=${APP_HOME}/frontend
            Environment=NODE_ENV=production
            Environment=PORT=${FRONTEND_PORT}
            ExecStart=${SERVE_PATH} -s . -l tcp://0.0.0.0:${FRONTEND_PORT} --single
            Restart=always
            RestartSec=10

            [Install]
            WantedBy=multi-user.target
            EOFSERVICE

            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S -p '' cp /tmp/pureclinc-frontend.service /etc/systemd/system/pureclinc-frontend.service
            rm -f /tmp/pureclinc-frontend.service
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S -p '' systemctl daemon-reload
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S -p '' systemctl enable pureclinc-frontend.service
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S -p '' systemctl restart pureclinc-frontend.service || echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S -p '' systemctl start pureclinc-frontend.service

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: deploy-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies (CI validation)
        working-directory: ./server
        run: npm ci

      - name: Clean backend directory on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            BACKEND_DIR=/home/${{ secrets.SERVER_USER }}/WebSites/PURECLINC/backend
            mkdir -p ${BACKEND_DIR}
            cd ${BACKEND_DIR}
            find . -mindepth 1 -maxdepth 1 ! -name 'node_modules' ! -name '.env' ! -name 'uploads' -exec rm -rf {} + 2>/dev/null || true

      - name: Deploy backend source files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: server/**
          target: /home/${{ secrets.SERVER_USER }}/WebSites/PURECLINC/backend
          strip_components: 1
          rm: false
          overwrite: true

      - name: Write backend .env (inline constants)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cat > /home/${{ secrets.SERVER_USER }}/WebSites/PURECLINC/backend/.env << EOF
            PORT=${{ env.BACKEND_PORT }}
            CLIENT_ORIGIN=http://localhost:${{ env.FRONTEND_PORT }}
            BASE_URL=http://localhost:${{ env.BACKEND_PORT }}

            DATABASE_URL=mysql+pymysql://root:root@localhost:3306/pureskin_clinic

            DB_HOST=localhost
            DB_USER=root
            DB_PASSWORD=root
            DB_NAME=pureskin_clinic

            JWT_SECRET=super_secret_jwt_key_change_me
            JWT_EXPIRES_IN=1h

            STRIPE_SECRET_KEY=sk_test_your_key_here
            STRIPE_WEBHOOK_SECRET=whsec_your_webhook_secret_here

            SMTP_HOST=smtp.gmail.com
            SMTP_PORT=587
            SMTP_SECURE=false
            SMTP_USER=mohammed.ismail2@students.alquds.edu
            SMTP_PASS=fehpbwauhedzglix

            MAIL_FROM="PureSkin Clinic <mohammed.ismail2@students.alquds.edu>"
            EMAIL_VERIFICATION_EXPIRY_MINUTES=15
            EMAIL_VERIFICATION_RESEND_SECONDS=60
            EOF

      - name: Install backend production dependencies
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            BACKEND_DIR=/home/${{ secrets.SERVER_USER }}/WebSites/PURECLINC/backend
            cd ${BACKEND_DIR}
            npm ci --omit=dev
            if [ ! -f .env ] && [ -f app.env ]; then
              cp app.env .env
            fi
            if [ -f .env ] && ! grep -q '^PORT=' .env; then
              echo 'PORT=${{ env.BACKEND_PORT }}' >> .env
            fi

      - name: Setup backend systemd service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            APP_USER=${{ secrets.SERVER_USER }}
            APP_HOME=/home/${{ secrets.SERVER_USER }}/WebSites/PURECLINC
            BACKEND_PORT=${{ env.BACKEND_PORT }}
            EXTRA_OPEN_PORT=${{ env.EXTRA_OPEN_PORT }}

            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S -p '' ufw allow ${BACKEND_PORT}/tcp comment 'PURECLINC Backend' 2>/dev/null || true
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S -p '' ufw allow ${EXTRA_OPEN_PORT}/tcp comment 'PURECLINC Extra' 2>/dev/null || true
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S -p '' systemctl unmask pureclinc-backend.service 2>/dev/null || true
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S -p '' systemctl stop pureclinc-backend.service 2>/dev/null || true
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S -p '' systemctl disable pureclinc-backend.service 2>/dev/null || true

            NODE_PATH=$(command -v node || echo /usr/bin/node)
            cat > /tmp/pureclinc-backend.service << EOFSERVICE
            [Unit]
            Description=PURECLINC Backend Service
            After=network.target

            [Service]
            Type=simple
            User=${APP_USER}
            WorkingDirectory=${APP_HOME}/backend
            Environment=NODE_ENV=production
            Environment=PORT=${BACKEND_PORT}
            ExecStart=${NODE_PATH} server.js
            Restart=always
            RestartSec=10

            [Install]
            WantedBy=multi-user.target
            EOFSERVICE

            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S -p '' cp /tmp/pureclinc-backend.service /etc/systemd/system/pureclinc-backend.service
            rm -f /tmp/pureclinc-backend.service
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S -p '' systemctl daemon-reload
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S -p '' systemctl enable pureclinc-backend.service
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S -p '' systemctl restart pureclinc-backend.service || echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S -p '' systemctl start pureclinc-backend.service

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo 'Checking backend on port ${{ env.BACKEND_PORT }}...'
            curl -fsS http://localhost:${{ env.BACKEND_PORT }}/api/health || curl -fsS http://localhost:${{ env.BACKEND_PORT }} || echo 'Backend health check failed (non-blocking).'
            echo 'Checking frontend on port ${{ env.FRONTEND_PORT }}...'
            curl -fsS http://localhost:${{ env.FRONTEND_PORT }} || echo 'Frontend health check failed (non-blocking).'
            echo 'Checking extra service on port ${{ env.EXTRA_OPEN_PORT }}...'
            curl -fsS http://localhost:${{ env.EXTRA_OPEN_PORT }} || echo 'Extra port check failed (non-blocking).'
